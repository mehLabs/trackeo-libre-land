<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Política de privacidad de TrackeoLibre, extensión Chrome para MercadoLibre Argentina."
        />
        <title>Política de Privacidad | TrackeoLibre</title>
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@90,500;100,600;110,700;115,800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg sticky-top site-nav">
            <div class="container">
                <a
                    class="navbar-brand d-flex align-items-center gap-2"
                    href="index.html"
                    aria-label="TrackeoLibre inicio"
                >
                    <img
                        src="assets/trackeolibre-logo.png"
                        alt=""
                        width="38"
                        height="38"
                        class="brand-mark"
                    />
                    <span>TrackeoLibre</span>
                </a>

                <div class="ms-auto">
                    <a
                        class="btn btn-outline-dark btn-sm px-3"
                        href="index.html"
                        >Volver</a
                    >
                </div>
            </div>
        </nav>

        <main class="section-pad">
            <div class="container">
                <article
                    class="bg-white border rounded-2 p-4 p-md-5 shadow-sm"
                    id="privacyPolicy"
                    aria-live="polite"
                >
                    <p class="section-copy mb-0">
                        Cargando política de privacidad...
                    </p>
                </article>
            </div>
        </main>

        <script>
            const policyContainer = document.getElementById('privacyPolicy');

            function escapeHtml(value) {
                return value
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function renderInlineMarkdown(value) {
                return escapeHtml(value).replace(
                    /`([^`]+)`/g,
                    '<code>$1</code>',
                );
            }

            function renderMarkdown(markdown) {
                const lines = markdown.replace(/\r\n/g, '\n').split('\n');
                const html = [];
                let paragraph = [];
                let listItems = [];

                function flushParagraph() {
                    if (!paragraph.length) {
                        return;
                    }

                    html.push(
                        `<p class="section-copy">${renderInlineMarkdown(
                            paragraph.join(' '),
                        )}</p>`,
                    );
                    paragraph = [];
                }

                function flushList() {
                    if (!listItems.length) {
                        return;
                    }

                    html.push(
                        `<ul class="section-copy">${listItems
                            .map(
                                (item) =>
                                    `<li>${renderInlineMarkdown(item)}</li>`,
                            )
                            .join('')}</ul>`,
                    );
                    listItems = [];
                }

                lines.forEach((line) => {
                    const trimmedLine = line.trim();

                    if (!trimmedLine) {
                        flushParagraph();
                        flushList();
                        return;
                    }

                    if (trimmedLine.startsWith('# ')) {
                        flushParagraph();
                        flushList();
                        html.push(
                            `<h1 class="section-title mb-4">${renderInlineMarkdown(
                                trimmedLine.slice(2),
                            )}</h1>`,
                        );
                        return;
                    }

                    if (trimmedLine.startsWith('## ')) {
                        flushParagraph();
                        flushList();
                        html.push(
                            `<h2 class="h4 fw-bold mt-5 mb-3">${renderInlineMarkdown(
                                trimmedLine.slice(3),
                            )}</h2>`,
                        );
                        return;
                    }

                    if (trimmedLine.startsWith('- ')) {
                        flushParagraph();
                        listItems.push(trimmedLine.slice(2));
                        return;
                    }

                    flushList();
                    paragraph.push(trimmedLine);
                });

                flushParagraph();
                flushList();

                return html.join('');
            }

            fetch('privacy-policy.md')
                .then((response) => {
                    if (!response.ok) {
                        throw new Error('No se pudo cargar privacy-policy.md');
                    }

                    return response.text();
                })
                .then((markdown) => {
                    policyContainer.innerHTML = renderMarkdown(markdown);
                })
                .catch(() => {
                    policyContainer.innerHTML =
                        '<h1 class="section-title mb-4">Política de Privacidad</h1><p class="section-copy">No se pudo cargar la política desde Markdown. Abrí <a href="privacy-policy.md">privacy-policy.md</a> para ver el documento fuente.</p>';
                });
        </script>
    </body>
</html>
